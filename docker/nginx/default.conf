server {
  listen 8080;
  server_name _;

  root /app/public;
  index index.php;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json application/vnd.api+json
             application/xml application/atom+xml application/rss+xml
             image/svg+xml text/css text/javascript text/plain;

  location ~* ^/assets/.*\.(?:css|js)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
    access_log off;
  }

  location ~* ^/assets/.*\.(?:jpg|jpeg|gif|png|webp|ico|svg|ttf|otf|eot|woff|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  location ~ ^/index\.php(/|$) {
    include fastcgi.conf;
    fastcgi_pass php:9000;
    internal;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }
}
